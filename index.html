<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#120400" />
<title>Kanix AI Assistant</title>
<style>
:root {
  --ground: #120400;
  --panel: rgba(42, 14, 4, 0.55);
  --panel-solid: #1e0a03;
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.72);
  --ink-faint: rgba(255, 255, 255, 0.45);
  --flame: #ff3d00;
  --flame-lit: #ff8a1f;
  --hair: rgba(255, 255, 255, 0.12);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---------- animated ember background ---------- */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.bg span {
  position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.45;
  animation: drift 14s ease-in-out infinite alternate;
}
.bg span:nth-child(1) { width: 320px; height: 320px; background: #ff3d00; top: -80px; left: -60px; }
.bg span:nth-child(2) { width: 280px; height: 280px; background: #ff8a1f; bottom: -60px; right: -40px; animation-delay: -5s; }
.bg span:nth-child(3) { width: 200px; height: 200px; background: #7e14ff; top: 40%; left: 40%; opacity: 0.25; animation-delay: -9s; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(40px, -30px) scale(1.15); }
}

/* ---------- layout ---------- */
.app {
  height: 100%; display: flex; flex-direction: column;
  max-width: 560px; margin: 0 auto;
  padding: env(safe-area-inset-top, 0px) 14px env(safe-area-inset-bottom, 0px);
}

/* ---------- header ---------- */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 6px 10px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
.logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--flame), var(--flame-lit));
  box-shadow: 0 6px 20px rgba(255, 61, 0, 0.4);
  display: grid; place-items: center; font-size: 15px;
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 6px 20px rgba(255, 61, 0, 0.4); }
  50% { box-shadow: 0 6px 30px rgba(255, 138, 31, 0.7); }
}
.status { font-size: 12px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

/* ---------- chat ---------- */
.chat {
  flex: 1; overflow-y: auto; padding: 8px 4px 16px;
  display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: none;
}
.chat::-webkit-scrollbar { display: none; }

.welcome {
  margin: auto 0; text-align: center; padding: 10px 6px;
  animation: rise 0.9s var(--ease) both;
}
.welcome h1 {
  font-size: clamp(26px, 7vw, 36px); font-weight: 600; line-height: 1.1; letter-spacing: -0.03em;
}
.welcome h1 em { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; color: var(--flame-lit); }
.welcome p { margin-top: 10px; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }

.msg {
  max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.5;
  animation: rise 0.45s var(--ease) both; word-wrap: break-word;
}
.msg.user {
  align-self: flex-end; color: #fff;
  background: linear-gradient(135deg, var(--flame), var(--flame-lit));
  border-bottom-right-radius: 6px;
}
.msg.bot {
  align-self: flex-start; background: var(--panel); border: 1px solid var(--hair);
  backdrop-filter: blur(14px); border-bottom-left-radius: 6px;
}

.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--flame-lit);
  animation: bounce 1s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- quick actions ---------- */
.actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 10px;
}
.action {
  text-align: left; padding: 14px; border-radius: 16px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--hair); color: var(--ink);
  backdrop-filter: blur(14px); font: inherit;
  transition: transform 0.3s var(--ease), border-color 0.3s var(--ease);
  animation: rise 0.6s var(--ease) both;
}
.action:nth-child(2) { animation-delay: 0.08s; }
.action:nth-child(3) { animation-delay: 0.16s; }
.action:nth-child(4) { animation-delay: 0.24s; }
.action:active, .action:hover { transform: translateY(-3px); border-color: rgba(255, 138, 31, 0.6); }
.action b { display: block; font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
.action small { color: var(--ink-faint); font-size: 12px; line-height: 1.35; }
.action .ico { font-size: 20px; display: block; margin-bottom: 8px; }

/* ---------- input ---------- */
.composer {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; margin-bottom: 12px;
  border-radius: 22px; background: var(--panel-solid); border: 1px solid var(--hair);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
}
.composer:focus-within { border-color: rgba(255, 138, 31, 0.7); box-shadow: 0 0 0 4px rgba(255, 61, 0, 0.15); }
.composer input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
  color: #fff; font: inherit; font-size: 16px; padding: 10px 8px;
}
.composer input::placeholder { color: var(--ink-faint); }
.send {
  width: 42px; height: 42px; flex: none; border: 0; border-radius: 50%; cursor: pointer;
  background: linear-gradient(135deg, var(--flame), var(--flame-lit)); color: #fff; font-size: 18px;
  transition: transform 0.25s var(--ease);
}
.send:active { transform: scale(0.92); }
.send:disabled { opacity: 0.4; cursor: default; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true">✦</div>
      <span>Kanix AI</span>
    </div>
    <div class="status"><i></i>Online</div>
  </header>

  <main class="chat" id="chat" aria-live="polite">
    <section class="welcome" id="welcome">
      <h1>Kya help chahiye? <em>Aaj</em></h1>
      <p>Mujhse kuch bhi poochho ya neeche se koi option chuno.</p>
    </section>

    <div class="actions" id="actions">
      <button class="action" data-q="Mere liye ek notes list banao"><span class="ico">📝</span><b>Notes banao</b><small>Points ko list mein badlo</small></button>
      <button class="action" data-q="Aaj ke liye task list banao"><span class="ico">✅</span><b>Task list</b><small>Din ke kaam plan karo</small></button>
      <button class="action" data-q="Mujhe kuch naya idea suggest karo"><span class="ico">💡</span><b>Idea suggest</b><small>Naye ideas paao</small></button>
      <button class="action" data-q="Ye sentence English mein translate karo"><span class="ico">🌐</span><b>Translate</b><small>Bhasha badlo</small></button>
    </div>
  </main>

  <form class="composer" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Yahan likho..." aria-label="Message" />
    <button class="send" id="send" type="submit" aria-label="Send">➤</button>
  </form>
</div>

<script>
  const chat = document.getElementById('chat');
  const actions = document.getElementById('actions');
  const welcome = document.getElementById('welcome');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // Conversation history sent to the server so answers keep context.
  const history = [];

  function addMsg(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.style.whiteSpace = 'pre-wrap';
    el.textContent = text;
    chat.appendChild(el);
    scrollDown();
    return el;
  }

  function scrollDown() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  async function getAnswer() {
    const typing = document.createElement('div');
    typing.className = 'msg bot';
    typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    chat.appendChild(typing);
    scrollDown();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-20) }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) throw new Error(data.error || 'Server error');
      history.push({ role: 'assistant', content: data.reply });
      addMsg(data.reply, 'bot');
    } catch (err) {
      typing.remove();
      addMsg('Maaf kijiye, abhi jawab nahi aa paya. Thodi der baad dobara try karein.', 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function send(text) {
    const clean = text.trim();
    if (!clean || sendBtn.disabled) return;
    if (welcome.parentNode) welcome.remove();
    actions.style.display = 'none';
    addMsg(clean, 'user');
    history.push({ role: 'user', content: clean });
    input.value = '';
    sendBtn.disabled = true;
    getAnswer();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    send(input.value);
  });

  actions.addEventListener('click', (e) => {
    const btn = e.target.closest('.action');
    if (btn) send(btn.dataset.q);
  });
</script>
</body>
</html>
